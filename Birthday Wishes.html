<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg1: #ffe1ec; --bg2: #fff3c9; --card: #ffffffee; --text: #3a2340;
  --muted: #7b6483; --accent: #ff4f8b; --accent2: #7c5cff; --btn-text: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #2a1533; --bg2: #14213d; --card: #241a33ee; --text: #fff4fb;
    --muted: #cbb6d6; --accent: #ff6fa3; --accent2: #9b86ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg1: #2a1533; --bg2: #14213d; --card: #241a33ee; --text: #fff4fb;
  --muted: #cbb6d6; --accent: #ff6fa3; --accent2: #9b86ff; color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: linear-gradient(160deg, var(--bg1), var(--bg2)); background-attachment: fixed;
  color: var(--text);
  font-family: "Poppins", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  display: flex; align-items: center; justify-content: center;
  min-height: 100dvh; padding: 20px; overflow-x: hidden;
}
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.card {
  position: relative; z-index: 2; width: 100%; max-width: 460px; text-align: center;
  background: var(--card); border-radius: 28px; padding: 32px 22px 28px;
  box-shadow: 0 18px 50px rgba(124, 92, 255, .25); backdrop-filter: blur(6px);
}
.screen { display: none; }
.screen.active { display: block; animation: in .5s ease; }
@keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
.dots span { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); opacity: .35; transition: .3s; }
.dots span.on { opacity: 1; background: var(--accent); transform: scale(1.3); }
.big { font-size: clamp(64px, 22vw, 96px); line-height: 1; display: inline-block; animation: bounce 1.6s ease-in-out infinite; user-select: none; }
@keyframes bounce { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
h1 { font-size: clamp(28px, 9vw, 42px); margin: 14px 0 8px; line-height: 1.15;
  background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.name { font-size: clamp(26px, 9vw, 40px); font-weight: 700; margin: 0 0 12px; word-break: break-word; }
.sub { color: var(--muted); font-size: clamp(15px, 4.4vw, 18px); margin: 0 0 22px; }
.age { display: inline-block; margin: 0 0 16px; padding: 6px 16px; border-radius: 999px; font-weight: 600; font-size: clamp(15px, 4.5vw, 18px); color: var(--btn-text); background: linear-gradient(90deg, var(--accent2), var(--accent)); }
.age[hidden] { display: none; }
.wish { min-height: 5.2em; font-size: clamp(17px, 4.8vw, 20px); line-height: 1.55; color: var(--muted); margin: 0 0 22px; transition: opacity .4s; }
.wish.fade { opacity: 0; }
input {
  display: block; width: 100%; margin-bottom: 12px; padding: 14px 16px; font-size: 16px; text-align: center;
  border-radius: 14px; border: 2px solid var(--accent2); background: transparent; color: var(--text); outline: none;
}
input:focus { border-color: var(--accent); }
input.err { border-color: #e5383b; animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
button {
  font: inherit; font-size: 17px; font-weight: 600; width: 100%; padding: 15px 22px; border: 0; border-radius: 14px;
  color: var(--btn-text); background: linear-gradient(90deg, var(--accent), var(--accent2));
  cursor: pointer; touch-action: manipulation; box-shadow: 0 6px 16px rgba(255, 79, 139, .35);
}
button:active { transform: scale(.97); }
.surprise { background: linear-gradient(90deg, #ffb703, #ff4f8b); font-size: 19px; padding: 18px 22px; }
.surprise-msg { min-height: 2em; margin: 16px 0 0; font-weight: 600; font-size: clamp(17px, 4.8vw, 20px); }
.link { background: none; box-shadow: none; color: var(--muted); font-size: 14px; font-weight: 500; margin-top: 14px; padding: 8px; text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { .big { animation: none; } .screen.active { animation: none; } }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main class="card">
  <div class="dots" aria-hidden="true"><span class="on"></span><span></span><span></span></div>

  <!-- Page 1: type your name -->
  <section class="screen active" id="s1">
    <div class="big">🎂</div>
    <h1>Hello there!</h1>
    <p class="sub">Type your name to begin</p>
    <input id="nameInput" type="text" maxlength="30" placeholder="Your name" aria-label="Your name" autocomplete="off">
    <input id="ageInput" type="number" inputmode="numeric" min="1" max="120" placeholder="Your age (optional)" aria-label="Your age (optional)">
    <button id="next1">Next →</button>
  </section>

  <!-- Page 2: birthday wishes -->
  <section class="screen" id="s2">
    <div class="big">🎉</div>
    <h1>Happy Birthday!</h1>
    <p class="name" id="name"></p>
    <p class="age" id="age" hidden></p>
    <p class="wish" id="wish"></p>
    <button id="next2">Next →</button>
  </section>

  <!-- Page 3: surprises -->
  <section class="screen" id="s3">
    <div class="big">🎁</div>
    <h1>One more thing…</h1>
    <p class="sub">A little something just for you</p>
    <button class="surprise" id="surprise">Click here for surprises 🎁</button>
    <p class="surprise-msg" id="surpriseMsg" aria-live="polite"></p>
    <button class="link" id="restart">Start over</button>
  </section>
</main>

<script>
(function () {
  var canvas = document.getElementById('confetti'), ctx = canvas.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize(); window.addEventListener('resize', resize);

  var colors = ['#ff4f8b', '#ffc93c', '#7c5cff', '#2ec4b6', '#ff8c42', '#4cc9f0'];
  var animals = ['🦄', '🐶', '🐱', '🐼', '🐥', '🐰', '🦊', '🐸'];
  var parts = [], running = false;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function pick(a) { return a[(Math.random() * a.length) | 0]; }

  function burst(x, y, count) {
    if (reduce) count = Math.round(count / 3);
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 9, em = Math.random() < 0.08;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6,
        size: em ? 22 + Math.random() * 10 : 6 + Math.random() * 8, color: pick(colors),
        shape: em ? 'e' : (Math.random() < 0.5 ? 'r' : 'c'), emoji: pick(animals),
        rot: Math.random() * 6.28, vr: (Math.random() - .5) * .3 });
    }
    start();
  }
  function rain(count) {
    for (var i = 0; i < count; i++) {
      var em = Math.random() < 0.06;
      parts.push({ x: Math.random() * W, y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3,
        size: em ? 22 + Math.random() * 8 : 6 + Math.random() * 7, color: pick(colors),
        shape: em ? 'e' : (Math.random() < 0.5 ? 'r' : 'c'), emoji: pick(animals),
        rot: Math.random() * 6.28, vr: (Math.random() - .5) * .2 });
    }
    start();
  }
  function rainEmoji(list, count) {
    for (var i = 0; i < count; i++) {
      parts.push({ x: Math.random() * W, y: -30 - Math.random() * H * .6, vx: (Math.random() - .5) * 2, vy: 1.5 + Math.random() * 2.5,
        size: 26 + Math.random() * 14, color: '#fff', shape: 'e', emoji: pick(list), rot: 0, vr: (Math.random() - .5) * .08 });
    }
    start();
  }
  function start() { if (!running) { running = true; requestAnimationFrame(tick); } }
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += 0.18; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > H + 40) { parts.splice(i, 1); continue; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.shape === 'e') { ctx.font = p.size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.emoji, 0, 0); }
      else if (p.shape === 'r') { ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); }
      else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, p.size / 2.5, 0, 6.28); ctx.fill(); }
      ctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0, 0, W, H); }
  }

  // ---- Pages ----
  var screens = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3')];
  var dots = document.querySelectorAll('.dots span');
  function show(n) {
    screens.forEach(function (s, i) { s.classList.toggle('active', i === n); });
    dots.forEach(function (d, i) { d.classList.toggle('on', i === n); });
  }

  var wishes = [
    'Wishing you a day filled with laughter, love, and all your favorite things!',
    'May this new year of your life bring you joy, health, and big adventures!',
    'You make the world brighter just by being in it. Enjoy every moment today!',
    'Here’s to cake, candles, and dreams coming true. Have a fantastic birthday!'
  ];
  var wishEl = document.getElementById('wish'), wi = 0, timer = null;
  function cycle() {
    wishEl.classList.add('fade');
    setTimeout(function () { wishEl.textContent = wishes[wi]; wishEl.classList.remove('fade'); wi = (wi + 1) % wishes.length; }, 350);
  }

  var nameInput = document.getElementById('nameInput');
  function goWishes() {
    var v = nameInput.value.trim();
    if (!v) { nameInput.classList.remove('err'); void nameInput.offsetWidth; nameInput.classList.add('err'); nameInput.focus(); return; }
    document.getElementById('name').textContent = v;
    var a = parseInt(document.getElementById('ageInput').value, 10), ageEl = document.getElementById('age');
    if (a > 0 && a < 121) { ageEl.textContent = '🎈 Turning ' + a + '! 🎈'; ageEl.hidden = false; } else { ageEl.hidden = true; }
    wi = 0; wishEl.textContent = wishes[0]; wi = 1;
    clearInterval(timer); timer = setInterval(cycle, 5000);
    show(1);
    burst(W / 2, H * 0.3, 130); rain(60);
  }
  document.getElementById('next1').addEventListener('click', goWishes);
  nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') goWishes(); });
  document.getElementById('ageInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') goWishes(); });
  nameInput.addEventListener('input', function () { nameInput.classList.remove('err'); });

  document.getElementById('next2').addEventListener('click', function () { clearInterval(timer); show(2); });

  var surprises = [
    function () { rainEmoji(['🎈'], 30); return 'Surprise! Balloons for you! 🎈'; },
    function () { rainEmoji(['🎁', '🍰', '🧁'], 30); return 'Surprise! Gifts and cake, enjoy! 🍰'; },
    function () {
      for (var i = 0; i < 5; i++) setTimeout(function () { burst(W * (.15 + Math.random() * .7), H * (.15 + Math.random() * .4), 70); }, i * 350);
      return 'Surprise! Fireworks just for you! 🎆';
    },
    function () { rainEmoji(['✨', '⭐', '🌟'], 40); return 'Surprise! You’re a star! 🌟'; },
    function () { rainEmoji(['🤗', '💖', '🥳'], 30); return 'Surprise! A big virtual hug! 🤗'; }
  ];
  var si = 0;
  document.getElementById('surprise').addEventListener('click', function () {
    document.getElementById('surpriseMsg').textContent = surprises[si]();
    si = (si + 1) % surprises.length;
  });

  document.getElementById('restart').addEventListener('click', function () {
    nameInput.value = ''; document.getElementById('ageInput').value = '';
    document.getElementById('surpriseMsg').textContent = ''; si = 0;
    show(0); nameInput.focus();
  });

  document.getElementById('s2').addEventListener('click', function (e) {
    if (e.target.closest('button')) return;
    burst(e.clientX, e.clientY, 40);
  });
})();
</script>
</body>
</html>
